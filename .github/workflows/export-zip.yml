name: Export ConnectChat ZIP
on:
  push:
    branches: [main]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create ZIP
        run: git archive --format=zip --output=connectchat-current.zip HEAD
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: connectchat-current
          path: connectchat-current.zip
