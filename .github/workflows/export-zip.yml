name: Export ConnectChat ZIP
on:
  push:
    branches: [main]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create ZIP
        run: git archive --format=zip --output=connectchat-current.zip 58906035677683c5094b3ea4878df16fb485d3b1
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: connectchat-current-clean
          path: connectchat-current.zip
